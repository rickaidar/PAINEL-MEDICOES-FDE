<style>
:root{--ink:#16191e;--card:#1d2127;--accent:#c2410c;--accent-soft:#fbe9df;--muted:#9aa1ad;--line:#333b45;--err:#f87171;
--disp:'Archivo',system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#222831,var(--ink));color:#fff;font-family:var(--body);
display:flex;align-items:center;justify-content:center;padding:20px}
.gate{width:100%;max-width:340px;text-align:center}
.brand{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.lock{width:46px;height:46px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:14px auto 10px}
h1{font-family:var(--disp);font-weight:800;font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:22px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);transition:.15s}
.dot.on{background:var(--accent);border-color:var(--accent)}
.msg{height:18px;font-size:12px;color:var(--err);font-family:var(--mono);margin-bottom:14px;opacity:0;transition:.15s}
.msg.show{opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{aspect-ratio:1.7/1;background:var(--card);border:1px solid var(--line);border-radius:11px;color:#fff;
font-family:var(--mono);font-size:20px;font-weight:600;cursor:pointer;transition:.12s;user-select:none}
.key:hover{background:#262c34;border-color:#465160}
.key:active{transform:scale(.96);background:var(--accent);border-color:var(--accent)}
.key.fn{font-size:13px;font-family:var(--body);color:var(--muted)}
.foot{margin-top:20px;font-size:10.5px;color:#6b7280;font-family:var(--mono)}
.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.busy{pointer-events:none;opacity:.55}
</style>
</head>

const dotsEl = document.getElementById('dots').children;
const msgEl = document.getElementById('msg');
const gateEl = document.getElementById('gate');
let pin = '', busy = false;

function render(){ for(let i=0;i<4;i++) dotsEl[i].classList.toggle('on', i < pin.length); }
function showMsg(t){ msgEl.textContent = t; msgEl.classList.add('show'); }
function clearMsg(){ msgEl.classList.remove('show'); }

function b64(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

async function tryUnlock(){
  busy = true; gateEl.classList.add('busy'); showMsg('verificando…'); msgEl.style.color='var(--muted)';
  try{
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const ptBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
    const html = new TextDecoder().decode(ptBuf);
    document.open(); document.write(html); document.close();
  }catch(e){
    busy = false; gateEl.classList.remove('busy'); pin=''; render();
    msgEl.style.color='var(--err)'; showMsg('senha incorreta');
    gateEl.classList.remove('shake'); void gateEl.offsetWidth; gateEl.classList.add('shake');
  }
}

function press(k){
  if(busy) return;
  if(k==='back'){ pin = pin.slice(0,-1); clearMsg(); render(); return; }
  if(k==='clear'){ pin=''; clearMsg(); render(); return; }
  if(pin.length>=4) return;
  clearMsg(); pin += k; render();
  if(pin.length===4) tryUnlock();
}

document.getElementById('pad').addEventListener('click', e=>{ const b=e.target.closest('.key'); if(b) press(b.dataset.k); });
window.addEventListener('keydown', e=>{
  if(e.key>='0'&&e.key<='9') press(e.key);
  else if(e.key==='Backspace') press('back');
  else if(e.key==='Escape') press('clear');
});
render();
</script>
